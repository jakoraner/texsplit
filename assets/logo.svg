<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>TeX Split</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2342"/>
      <stop offset="1" stop-color="#14111F"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEAF3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS squircle -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- left: LaTeX source -->
  <g font-family="Menlo, monospace" font-weight="700">
    <text x="176" y="352" font-size="150" fill="#B98CF0">\</text>
  </g>
  <g stroke-linecap="round" stroke-width="26">
    <line x1="268" y1="312" x2="420" y2="312" stroke="#B98CF0"/>
    <line x1="176" y1="420" x2="430" y2="420" stroke="#8C84A8"/>
    <line x1="176" y1="490" x2="380" y2="490" stroke="#8C84A8"/>
    <line x1="176" y1="560" x2="418" y2="560" stroke="#8C84A8"/>
    <line x1="176" y1="630" x2="330" y2="630" stroke="#8C84A8"/>
    <line x1="176" y1="740" x2="300" y2="740" stroke="#5E577A"/>
    <line x1="176" y1="810" x2="400" y2="810" stroke="#5E577A"/>
  </g>
  <!-- the cursor: you still write -->
  <rect x="342" y="606" width="14" height="48" rx="4" fill="#FFD84D"/>

  <!-- the split -->
  <line x1="512" y1="170" x2="512" y2="854" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>

  <!-- right: the PDF page, marked up -->
  <g filter="url(#shadow)">
    <path d="M560 210 H808 L868 270 V820 Q868 840 848 840 H580 Q560 840 560 820 Z" fill="url(#page)"/>
    <path d="M808 210 V270 H868 Z" fill="#D6D2E4"/>
  </g>
  <rect x="604" y="294" width="170" height="26" rx="8" fill="#2A2342"/>
  <g stroke-linecap="round" stroke-width="16" stroke="#B4AFC6">
    <line x1="604" y1="380" x2="826" y2="380"/>
    <line x1="604" y1="430" x2="826" y2="430"/>
    <line x1="604" y1="530" x2="826" y2="530"/>
    <line x1="604" y1="580" x2="760" y2="580"/>
    <line x1="604" y1="680" x2="826" y2="680"/>
    <line x1="604" y1="730" x2="790" y2="730"/>
  </g>
  <!-- highlight -->
  <rect x="592" y="458" width="246" height="44" rx="8" fill="#FFD84D" opacity="0.9"/>
  <line x1="604" y1="480" x2="800" y2="480" stroke="#7A6A2E" stroke-width="16" stroke-linecap="round"/>
  <!-- Preview-style note -->
  <g transform="translate(818 598) rotate(6)">
    <path d="M0 0 H64 L84 20 V84 H0 Z" fill="#FFD84D" stroke="#C9A21E" stroke-width="4"/>
    <path d="M64 0 V20 H84 Z" fill="#E6BE32"/>
    <g stroke="#8A7425" stroke-width="7" stroke-linecap="round">
      <line x1="14" y1="34" x2="66" y2="34"/>
      <line x1="14" y1="52" x2="66" y2="52"/>
      <line x1="14" y1="70" x2="46" y2="70"/>
    </g>
  </g>
</svg>
